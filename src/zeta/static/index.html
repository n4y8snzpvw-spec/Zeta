<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zeta — AI Chat</title>
  <style>
    :root {
      --bg: #07111f;
      --panel: #0f1b2d;
      --panel-strong: #12223b;
      --sidebar: #0b1629;
      --line: rgba(148, 163, 184, 0.18);
      --text: #edf3ff;
      --muted: #9db0d6;
      --primary: #7c8cff;
      --primary-strong: #5d6ef6;
      --assistant: #1a2a44;
      --user: #5865f2;
      --success: #2dd4bf;
      --shadow: 0 20px 60px rgba(1, 6, 18, 0.5);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: radial-gradient(circle at top, #0d1b33 0%, var(--bg) 35%, #040915 100%);
      color: var(--text);
      font-family: Inter, "Segoe UI", sans-serif;
    }

    body {
      display: flex;
      align-items: stretch;
      justify-content: center;
      min-height: 100vh;
      padding: 18px;
    }

    .app {
      width: min(1220px, 100%);
      min-height: 90vh;
      display: flex;
      background: rgba(10, 17, 28, 0.82);
      border: 1px solid var(--line);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .sidebar {
      width: 280px;
      background: rgba(11, 22, 41, 0.96);
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      padding: 20px 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.5rem;
      font-weight: 800;
      padding: 6px 8px 18px;
    }

    .brand-mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--primary), #9f7aea);
      box-shadow: inset 0 1px 1px rgba(255,255,255,0.4);
    }

    .new-chat {
      border: 1px solid rgba(124, 140, 255, 0.4);
      background: rgba(124, 140, 255, 0.08);
      color: var(--text);
      border-radius: 12px;
      padding: 12px 14px;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 14px;
      transition: 0.2s ease;
    }

    .new-chat:hover {
      background: rgba(124, 140, 255, 0.16);
    }

    .saved-label {
      color: var(--muted);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 6px 8px 10px;
    }

    .saved-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow: auto;
      padding-right: 4px;
    }

    .saved-chat {
      width: 100%;
      text-align: left;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text);
      border-radius: 10px;
      padding: 10px 12px;
      cursor: pointer;
      font: inherit;
      transition: 0.15s ease;
    }

    .saved-chat:hover,
    .saved-chat.active {
      background: rgba(124, 140, 255, 0.1);
      border-color: rgba(124, 140, 255, 0.22);
    }

    .saved-chat small {
      display: block;
      color: var(--muted);
      margin-top: 3px;
      font-size: 0.7rem;
    }

    .chat-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 20px;
      border-bottom: 1px solid var(--line);
      background: rgba(15, 27, 45, 0.7);
    }

    .topbar h2 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 700;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 10px rgba(45, 212, 191, 0.9);
    }

    .toolbar {
      display: flex;
      gap: 8px;
    }

    .tool-btn {
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.03);
      color: var(--text);
      border-radius: 10px;
      padding: 9px 12px;
      font: inherit;
      cursor: pointer;
    }

    .tool-btn:hover {
      background: rgba(255,255,255,0.06);
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px 22px 12px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      background: linear-gradient(180deg, rgba(7, 17, 31, 0.1), rgba(10, 17, 28, 0.15));
    }

    .message {
      max-width: min(75%, 760px);
      padding: 14px 16px;
      border-radius: 18px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
      box-shadow: 0 6px 18px rgba(0,0,0,0.18);
    }

    .message.user {
      align-self: flex-end;
      background: linear-gradient(135deg, var(--user), #7a6cf5);
      border-bottom-right-radius: 6px;
    }

    .message.assistant {
      align-self: flex-start;
      background: var(--assistant);
      border: 1px solid rgba(148, 163, 184, 0.12);
      border-bottom-left-radius: 6px;
    }

    .composer {
      border-top: 1px solid var(--line);
      padding: 16px 18px 18px;
      background: rgba(11, 17, 30, 0.78);
    }

    form {
      display: flex;
      gap: 12px;
      align-items: end;
    }

    textarea {
      flex: 1;
      min-height: 56px;
      max-height: 180px;
      border: 1px solid rgba(148, 163, 184, 0.22);
      background: rgba(17, 24, 38, 0.9);
      color: var(--text);
      border-radius: 14px;
      padding: 14px 16px;
      resize: none;
      font: inherit;
      line-height: 1.45;
    }

    textarea:focus {
      outline: 2px solid rgba(124, 140, 255, 0.5);
      border-color: rgba(124, 140, 255, 0.5);
    }

    .send {
      border: none;
      background: linear-gradient(135deg, var(--primary), var(--primary-strong));
      color: white;
      border-radius: 14px;
      padding: 15px 20px;
      min-width: 116px;
      font-weight: 700;
      cursor: pointer;
    }

    .send:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    .hint {
      margin: 10px 2px 0;
      color: var(--muted);
      font-size: 0.8rem;
    }

    @media (max-width: 820px) {
      body { padding: 10px; }
      .app { min-height: 100vh; width: 100%; border-radius: 18px; }
      .sidebar {
        display: none;
      }
      .topbar { padding: 14px 14px; }
      #chat { padding: 16px 14px 8px; }
      .composer { padding: 12px 12px 14px; }
      form { flex-direction: column; }
      .send { width: 100%; }
      .message { max-width: 88%; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">✦</span> Zeta</div>
      <button class="new-chat" id="newChat">+ New chat</button>
      <div class="saved-label">Saved chats</div>
      <div class="saved-list" id="savedChats"></div>
    </aside>

    <main class="chat-panel">
      <header class="topbar">
        <h2>AI Chat</h2>
        <div class="toolbar">
          <button id="saveChat" class="tool-btn" type="button">Save</button>
          <button id="downloadChat" class="tool-btn" type="button">Download</button>
        </div>
      </header>

      <section id="chat" aria-live="polite"></section>

      <div class="composer">
        <form id="form">
          <textarea id="input" rows="2" placeholder="Ask Zeta anything…" aria-label="Message Zeta"></textarea>
          <button id="send" class="send" type="submit">Send</button>
        </form>
        <div class="hint">Press Enter to send · Shift + Enter for a new line</div>
      </div>
    </main>
  </div>

  <script>
    const chat = document.querySelector('#chat');
    const form = document.querySelector('#form');
    const input = document.querySelector('#input');
    const send = document.querySelector('#send');
    const saveChatBtn = document.querySelector('#saveChat');
    const downloadChatBtn = document.querySelector('#downloadChat');
    const newChatBtn = document.querySelector('#newChat');
    const savedChatsEl = document.querySelector('#savedChats');

    const STORAGE_KEY = 'zeta-saved-chats';
    let history = [];
    let currentChatId = null;

    function readSavedChats() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      } catch {
        return [];
      }
    }

    function persistSavedChats(chats) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(chats));
    }

    function formatDateLabel(dateString) {
      const date = new Date(dateString);
      return new Intl.DateTimeFormat(undefined, {
        month: 'short',
        day: 'numeric',
        hour: 'numeric',
        minute: '2-digit'
      }).format(date);
    }

    function createMessage(role, text) {
      const el = document.createElement('div');
      el.className = `message ${role}`;
      el.textContent = text;
      chat.appendChild(el);
      chat.scrollTop = chat.scrollHeight;
    }

    function renderSavedChats() {
      const chats = readSavedChats();
      savedChatsEl.innerHTML = '';

      if (!chats.length) {
        const empty = document.createElement('div');
        empty.style.color = 'var(--muted)';
        empty.style.padding = '10px 8px';
        empty.textContent = 'No saved chats yet';
        savedChatsEl.appendChild(empty);
        return;
      }

      chats.forEach((chatItem) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'saved-chat';
        if (chatItem.id === currentChatId) button.classList.add('active');
        button.innerHTML = `<span>${chatItem.title}</span><small>${formatDateLabel(chatItem.updatedAt)}</small>`;
        button.addEventListener('click', () => {
          history = chatItem.messages;
          currentChatId = chatItem.id;
          renderMessages();
          renderSavedChats();
        });
        savedChatsEl.appendChild(button);
      });
    }

    function renderMessages() {
      chat.innerHTML = '';
      history.forEach((message) => createMessage(message.role, message.content));
      if (!history.length) {
        createMessage('assistant', 'Hi! I’m Zeta. How can I help you today?');
      }
    }

    function newChat() {
      history = [];
      currentChatId = null;
      renderMessages();
      renderSavedChats();
      input.focus();
    }

    function saveCurrentChat() {
      if (!history.length) return;

      const title = history.find((m) => m.role === 'user')?.content?.slice(0, 30) || 'Untitled chat';
      const chats = readSavedChats();

      if (currentChatId) {
        const index = chats.findIndex((item) => item.id === currentChatId);
        if (index >= 0) {
          chats[index] = {
            ...chats[index],
            title: title || chats[index].title,
            updatedAt: new Date().toISOString(),
            messages: history,
          };
        }
      } else {
        const newItem = {
          id: Date.now(),
          title,
          updatedAt: new Date().toISOString(),
          messages: history,
        };
        chats.unshift(newItem);
        currentChatId = newItem.id;
      }

      persistSavedChats(chats);
      renderSavedChats();
    }

    function downloadCurrentChat() {
      if (!history.length) return;

      const text = history
        .map((message) => `${message.role.toUpperCase()}:\n${message.content}\n`)
        .join('\n---\n');
      const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'zeta-chat.txt';
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    async function sendMessage() {
      const text = input.value.trim();
      if (!text || send.disabled) return;

      input.value = '';
      history.push({ role: 'user', content: text });
      createMessage('user', text);
      send.disabled = true;
      send.textContent = '…';

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: history })
        });

        if (!response.ok) {
          throw new Error('The AI service is not available right now.');
        }

        const data = await response.json();
        const reply = data.message || 'I am not sure how to respond to that yet.';
        history.push({ role: 'assistant', content: reply });
        createMessage('assistant', reply);
      } catch (error) {
        const fallback = `Sorry, something went wrong: ${error.message}`;
        history.push({ role: 'assistant', content: fallback });
        createMessage('assistant', fallback);
      } finally {
        send.disabled = false;
        send.textContent = 'Send';
        input.focus();
      }
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      sendMessage();
    });

    input.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        form.requestSubmit();
      }
    });

    saveChatBtn.addEventListener('click', saveCurrentChat);
    downloadChatBtn.addEventListener('click', downloadCurrentChat);
    newChatBtn.addEventListener('click', newChat);

    renderMessages();
    renderSavedChats();
    input.focus();
  </script>
</body>
</html>
