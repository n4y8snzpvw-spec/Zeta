<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zeta — AI Chat</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; background: #0b1020; color: #eef2ff; }
    main { max-width: 820px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; padding: 24px; box-sizing: border-box; }
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #27304d; padding-bottom: 18px; }
    h1 { margin: 0; font-size: 1.5rem; } .tag { color: #9ca9d6; font-size: .85rem; }
    #chat { flex: 1; padding: 28px 0; display: flex; flex-direction: column; gap: 14px; }
    .message { max-width: 75%; padding: 13px 16px; border-radius: 16px; white-space: pre-wrap; line-height: 1.45; }
    .user { align-self: flex-end; background: #5865f2; } .assistant { align-self: flex-start; background: #1c2744; }
    form { display: flex; gap: 10px; } textarea { flex: 1; resize: none; border: 1px solid #354268; border-radius: 12px; background: #111a32; color: inherit; padding: 13px; font: inherit; }
    button { border: 0; border-radius: 12px; background: #7c8cff; color: white; padding: 0 20px; font-weight: 700; cursor: pointer; } button:disabled { opacity: .55; cursor: wait; }
    .hint { color: #9ca9d6; font-size: .85rem; margin: 10px 0 0; }
  </style>
</head>
<body>
  <main>
    <header><h1>✦ Zeta</h1><span class="tag">AI chat</span></header>
    <section id="chat" aria-live="polite"><div class="message assistant">Hi! I’m Zeta. How can I help?</div></section>
    <form id="form"><textarea id="input" rows="2" placeholder="Message Zeta…" aria-label="Message"></textarea><button id="send">Send</button></form>
    <p class="hint">Enter to send · Shift+Enter for a new line</p>
  </main>
  <script>
    const chat = document.querySelector('#chat'), form = document.querySelector('#form'), input = document.querySelector('#input'), send = document.querySelector('#send');
    const history = [];
    function add(role, text) { const el = document.createElement('div'); el.className = `message ${role}`; el.textContent = text; chat.append(el); chat.scrollTop = chat.scrollHeight; }
    form.addEventListener('submit', async (event) => {
      event.preventDefault(); const text = input.value.trim(); if (!text || send.disabled) return;
      input.value = ''; add('user', text); history.push({role: 'user', content: text}); send.disabled = true; send.textContent = '…';
      try { const response = await fetch('/api/chat', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({messages: history})}); const data = await response.json(); if (!response.ok) throw new Error(data.detail || 'Request failed'); add('assistant', data.message); history.push({role: 'assistant', content: data.message}); }
      catch (error) { add('assistant', `Sorry, something went wrong: ${error.message}`); }
      finally { send.disabled = false; send.textContent = 'Send'; input.focus(); }
    });
    input.addEventListener('keydown', event => { if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); form.requestSubmit(); } });
  </script>
</body>
</html>
